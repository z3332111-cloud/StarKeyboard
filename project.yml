name: StarKeyboard
options:
  bundleIdPrefix: com.startown
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
targets:
  StarKeyboard:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core/Sources/KeyboardCore/Release.swift
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 糯糯鍵盤
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.startown.starkeyboard
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: StarKeyboardExtension
    scheme: {}
  StarKeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
      - path: Core/Sources/KeyboardCore
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: 糯糯鍵盤
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hant
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.startown.starkeyboard.keyboard
        PRODUCT_NAME: StarKeyboardExtension
