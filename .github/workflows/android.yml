name: 打包 Android 鍵盤

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "VERSION"
      - "tools/build_dict.py"
      - "tools/chat_phrases.txt"
      - "tools/build_fonts.py"
      - "tools/build_words.py"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "VERSION"
      - "tools/build_dict.py"
      - "tools/chat_phrases.txt"
      - "tools/build_fonts.py"
      - "tools/build_words.py"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

# 連續推好幾次時，只留最新的那次打包。拉取請求和 main 各排各的，避免互相取消。
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 讀取公開版本
        run: echo "APP_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"

      - name: 下載並轉換字典（小麥注音 MIT、OpenCC 繁簡 Apache 2.0）
        run: |
          git clone --depth 1 https://github.com/openvanilla/McBopomofo.git "$RUNNER_TEMP/McBopomofo"
          make -C "$RUNNER_TEMP/McBopomofo/Source/Data" data.txt
          for f in TSCharacters TSPhrases; do curl -sSfL -o "$RUNNER_TEMP/$f.txt" "https://raw.githubusercontent.com/BYVoid/OpenCC/master/data/dictionary/$f.txt"; done
          python3 tools/build_dict.py "$RUNNER_TEMP/McBopomofo/Source/Data/data.txt" android/app/src/main/assets/zhuyin.sqlite "$RUNNER_TEMP/TSCharacters.txt" "$RUNNER_TEMP/TSPhrases.txt"

      - name: 下載可愛字體並縮小（粉圓、芫荽、霞鶩文楷、源泉圓體、內海、俐方體11號，都是 SIL OFL 1.1）
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q fonttools
          curl -sSfL -o "$RUNNER_TEMP/huninn.ttf" https://github.com/justfont/open-huninn-font/releases/download/v2.1/jf-openhuninn-2.1.ttf
          curl -sSfL -o "$RUNNER_TEMP/iansui.zip" https://github.com/ButTaiwan/iansui/releases/download/v1.020/iansui.zip
          unzip -q -o "$RUNNER_TEMP/iansui.zip" -d "$RUNNER_TEMP/iansui"
          IANSUI=$(find "$RUNNER_TEMP/iansui" \( -iname "*.ttf" -o -iname "*.otf" \) | head -1)
          curl -sSfL -o "$RUNNER_TEMP/wenkai.ttf" https://github.com/lxgw/LxgwWenkaiTC/releases/download/v1.530/LXGWWenKaiTC-Regular.ttf
          curl -sSfL -o "$RUNNER_TEMP/gensen.zip" https://github.com/ButTaiwan/gensen-font/releases/download/v2.100/GenSenRounded2TW-otf.zip
          unzip -q -o "$RUNNER_TEMP/gensen.zip" -d "$RUNNER_TEMP/gensen"
          GENSEN=$(find "$RUNNER_TEMP/gensen" -iname "*.otf" | grep -iE "(-M|Medium).otf$" | head -1)
          [ -n "$GENSEN" ] || GENSEN=$(find "$RUNNER_TEMP/gensen" -iname "*.otf" | grep -iE "(-R|Regular).otf$" | head -1)
          echo "源泉圓體：$GENSEN"
          curl -sSfL -o "$RUNNER_TEMP/naikai.ttf" https://raw.githubusercontent.com/max32002/naikaifont/master/tw/NaikaiFont-Regular-Lite.ttf
          curl -sSfL -o "$RUNNER_TEMP/cubic.ttf" https://raw.githubusercontent.com/ACh-K/Cubic-11/main/fonts/ttf/Cubic_11.ttf
          "$RUNNER_TEMP/venv/bin/python" tools/build_fonts.py android/app/src/main/assets/zhuyin.sqlite android/app/src/main/assets/fonts huninn="$RUNNER_TEMP/huninn.ttf" iansui="$IANSUI" wenkai="$RUNNER_TEMP/wenkai.ttf" gensen="$GENSEN" naikai="$RUNNER_TEMP/naikai.ttf" cubic="$RUNNER_TEMP/cubic.ttf"

      - name: 下載英文常用字表（滑行輸入用；FrequencyWords，CC BY-SA 4.0）
        run: |
          curl -sSfL -o "$RUNNER_TEMP/en_50k.txt" https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2018/en/en_50k.txt
          python3 tools/build_words.py "$RUNNER_TEMP/en_50k.txt" android/app/src/main/assets/glide_words.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: 簽名金鑰
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::還沒設定簽名金鑰，這次用測試金鑰（之後換正式金鑰要先移除舊版再裝）"
          fi

      - name: 自動測試與打包
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle -p android testReleaseUnitTest assembleRelease --no-daemon --stacktrace

      - name: 整理安裝檔和更新說明
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk StarKeyboard.apk
          ls -la StarKeyboard.apk
          PREV=$(git describe --tags --abbrev=0 --match "android-[0-9]*" 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi
          {
            echo "這次更新："
            git log --no-merges --pretty="- %s" $RANGE -- android tools | head -20
            echo
            echo "在 Android 手機下載 StarKeyboard.apk，點開安裝。目前要先移除舊版再安裝（正式簽名金鑰設定好之後就能直接更新）。"
          } > release_notes.md
          cat release_notes.md

      # 拉取請求只跑測試並上傳安裝檔，不發佈，避免蓋掉 android-latest。
      - name: 發佈（不會蓋掉 iPhone 版的「最新版」）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: 糯糯鍵盤 Android v${{ env.APP_VERSION }}
          body_path: release_notes.md
          files: StarKeyboard.apk
          make_latest: "false"

      - name: 更新固定下載網址（android-latest 永遠是最新的安裝檔，安裝說明頁用這個）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "糯糯鍵盤 Android 最新版（固定網址）" --notes "這裡永遠是最新的 Android 安裝檔，每次打包會自動換新。各版本的更新內容請看 android-數字 的版本。" --prerelease --latest=false
          gh release edit android-latest --title "糯糯鍵盤 Android 最新版（固定網址）"
          gh release upload android-latest StarKeyboard.apk --clobber

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build
          path: |
            StarKeyboard.apk
            android/app/build/reports/tests/
          if-no-files-found: ignore
