name: 更新公開的安裝網站

# docs/ 裡的安裝網站改了，就複製到公開的 nuonuo-keyboard（GitHub Pages 從那裡發佈）
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tools/publish_site.sh"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: z3332111-cloud/nuonuo-keyboard
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          path: public-site
      - name: 複製網站
        run: tools/publish_site.sh public-site
      - name: 推上公開倉庫
        working-directory: public-site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "網站沒有變"; exit 0; fi
          git commit -m "更新安裝網站"
          git push
