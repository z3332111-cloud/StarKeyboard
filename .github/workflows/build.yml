name: 打包 iOS 鍵盤

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths-ignore:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

# 連續推好幾次時，只留最新的那次打包（避免舊的版本後完成、變成「最新版」）；main 和 develop 各排各的
concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    # ARM runners have repeatedly timed out while waiting for capacity.
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 讀取公開版本
        run: echo "APP_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"

      - name: 下載並轉換字典（小麥注音 MIT、OpenCC 繁簡 Apache 2.0）
        run: |
          git clone --depth 1 https://github.com/openvanilla/McBopomofo.git "$RUNNER_TEMP/McBopomofo"
          make -C "$RUNNER_TEMP/McBopomofo/Source/Data" data.txt
          for f in TSCharacters TSPhrases; do curl -sSfL -o "$RUNNER_TEMP/$f.txt" "https://raw.githubusercontent.com/BYVoid/OpenCC/master/data/dictionary/$f.txt"; done
          python3 tools/build_dict.py "$RUNNER_TEMP/McBopomofo/Source/Data/data.txt" Keyboard/Resources/zhuyin.sqlite "$RUNNER_TEMP/TSCharacters.txt" "$RUNNER_TEMP/TSPhrases.txt"
          cp "$RUNNER_TEMP/McBopomofo/LICENSE.txt" Keyboard/Resources/McBopomofo-LICENSE.txt

      - name: 下載可愛字體並縮小（粉圓、芫荽、霞鶩文楷、源泉圓體、內海、俐方體11號，都是 SIL OFL 1.1）
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q fonttools
          curl -sSfL -o "$RUNNER_TEMP/huninn.ttf" https://github.com/justfont/open-huninn-font/releases/download/v2.1/jf-openhuninn-2.1.ttf
          curl -sSfL -o "$RUNNER_TEMP/iansui.zip" https://github.com/ButTaiwan/iansui/releases/download/v1.020/iansui.zip
          unzip -q -o "$RUNNER_TEMP/iansui.zip" -d "$RUNNER_TEMP/iansui"
          IANSUI=$(find "$RUNNER_TEMP/iansui" \( -iname "*.ttf" -o -iname "*.otf" \) | head -1)
          curl -sSfL -o "$RUNNER_TEMP/wenkai.ttf" https://github.com/lxgw/LxgwWenkaiTC/releases/download/v1.530/LXGWWenKaiTC-Regular.ttf
          curl -sSfL -o "$RUNNER_TEMP/gensen.zip" https://github.com/ButTaiwan/gensen-font/releases/download/v2.100/GenSenRounded2TW-otf.zip
          unzip -q -o "$RUNNER_TEMP/gensen.zip" -d "$RUNNER_TEMP/gensen"
          GENSEN=$(find "$RUNNER_TEMP/gensen" -iname "*.otf" | grep -iE "(-M|Medium).otf$" | head -1)
          [ -n "$GENSEN" ] || GENSEN=$(find "$RUNNER_TEMP/gensen" -iname "*.otf" | grep -iE "(-R|Regular).otf$" | head -1)
          echo "源泉圓體：$GENSEN"
          curl -sSfL -o "$RUNNER_TEMP/naikai.ttf" https://raw.githubusercontent.com/max32002/naikaifont/master/tw/NaikaiFont-Regular-Lite.ttf
          curl -sSfL -o "$RUNNER_TEMP/cubic.ttf" https://raw.githubusercontent.com/ACh-K/Cubic-11/main/fonts/ttf/Cubic_11.ttf
          "$RUNNER_TEMP/venv/bin/python" tools/build_fonts.py Keyboard/Resources/zhuyin.sqlite Keyboard/Resources/Fonts huninn="$RUNNER_TEMP/huninn.ttf" iansui="$IANSUI" wenkai="$RUNNER_TEMP/wenkai.ttf" gensen="$GENSEN" naikai="$RUNNER_TEMP/naikai.ttf" cubic="$RUNNER_TEMP/cubic.ttf"

      - name: 下載英文常用字表（滑行輸入用；FrequencyWords，CC BY-SA 4.0）
        run: |
          curl -sSfL -o "$RUNNER_TEMP/en_50k.txt" https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2018/en/en_50k.txt
          python3 tools/build_words.py "$RUNNER_TEMP/en_50k.txt" Keyboard/Resources/glide_words.txt

      - name: 核心邏輯測試（注音組字、選字、剪貼簿）
        run: swift test --package-path Core

      - name: 產生 Xcode 專案
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate

      - name: 編譯
        run: |
          xcodebuild -project StarKeyboard.xcodeproj -scheme StarKeyboard -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build > build.log 2>&1 || { grep -E "error:" build.log | sort -u | head -60; tail -40 build.log; exit 1; }
          grep -E "warning:" build.log | grep -v "/build/" | sort -u | head -40 || true

      - name: 包成 IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/StarKeyboard.app Payload/
          ls -la Payload/StarKeyboard.app/PlugIns
          du -sh Payload/StarKeyboard.app
          zip -qry StarKeyboard.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: StarKeyboard-ipa
          path: StarKeyboard.ipa

      - name: 整理這次更新了什麼
        run: |
          PREV=$(git describe --tags --abbrev=0 --match "build-*" 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi
          {
            echo "這次更新："
            git log --no-merges --pretty="- %s" $RANGE -- . ":(exclude)android" | head -20
            echo
            echo "下載 StarKeyboard.ipa，用 Sideloadly 直接裝（不要先刪掉舊的，設定和資料會保留）。"
          } > release_notes.md
          cat release_notes.md

      # develop 發成「預發佈」的 dev-數字，不會變成 latest，App 的新版提醒只看 main 的 build-數字。
      # 拉取請求只上傳 IPA 成品，不發佈，避免蓋掉正式版。
      - name: 發佈到 Releases（方便下載）
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'main' && 'build' || 'dev' }}-${{ github.run_number }}
          name: 糯糯鍵盤 ${{ github.ref_name != 'main' && '開發版 ' || '' }}v${{ env.APP_VERSION }}
          body_path: release_notes.md
          files: StarKeyboard.ipa
          prerelease: ${{ github.ref_name != 'main' }}
          make_latest: ${{ github.ref_name == 'main' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
